[core]
respect_debugger = true
terminate_process_after_report = false
capture_all_thread_stacks = true
max_crash_files = 50

[buffers]
find_entity_ring_size = 32
tweakdb_ring_size = 16
archive_ring_size = 16
snapshot_interval_ms = 500

[symbols]
symbol_db_path = symbols/Cyberpunk2077.symbols.json
; Auto-fetch matching debug symbols for framework mods (RED4ext, CET, Mod Settings,
; Audioware, Input Loader) from their official GitHub releases so native crash frames
; show function names. Off by default; when on, contacts github.com at startup on a
; background thread and writes .pdb files into the symbols folder.
auto_download = false

[stack]
dump_slot_count = 512

[test]
test_inject_crash_after_seconds = 0

[watchdog]
hang_watchdog_enabled  = true
hang_threshold_seconds = 45

[hooks]
delay_hook_enabled       = true
findentity_hook_enabled  = true
tweakdb_hook_enabled     = true
status_hook_enabled      = true
